name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run lint
        id: lint
        continue-on-error: true
        run: npm run lint -- --format json --output-file eslint-report.json
      - name: Upload lint report
        if: steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.json
          retention-days: 3
      - name: Fail on lint errors
        if: steps.lint.outcome == 'failure'
        run: exit 1
      - run: npm run typecheck
      - run: npm run test
      - name: Test browser runner safety and retry states
        run: node --test scripts/aurora-watch-runner.test.mjs
      - name: Verify Edge Function upload boundaries
        run: |
          node --test scripts/check-edge-packages.test.mjs
          node scripts/check-edge-packages.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Aurora Inbox edge function
        run: deno check supabase/functions/admin-managed-channels/index.ts
      - name: Check AI visibility edge function
        run: deno check supabase/functions/admin-ai-visibility/index.ts
      - name: Check Opportunity Engine edge function
        run: deno check supabase/functions/firecrawl-prospect-search/index.ts
      - name: Test Opportunity Engine evidence rules
        run: deno test supabase/functions/firecrawl-prospect-search/audit.test.ts
      - name: Check Accessibility Care edge function
        run: deno check supabase/functions/admin-accessibility-care/index.ts
      - name: Check Voice pilot edge function
        run: deno check supabase/functions/admin-voice-pilots/index.ts
      - name: Check portfolio dashboard edge function
        run: deno check supabase/functions/admin-portfolio/index.ts
      - name: Check Aurora Watch backend
        run: deno check supabase/functions/website-guardian/index.ts
      - name: Check consolidated Aurora product API
        run: deno check supabase/functions/aurora-product-api/index.ts
      - name: Check private support administration and ingestion
        run: deno check --no-lock supabase/functions/admin-support/index.ts supabase/functions/support-ingest/index.ts
      - name: Check private support mailbox
        run: deno check --config supabase/functions/admin-support-mailbox/deno.json supabase/functions/admin-support-mailbox/index.ts
      - name: Test private mailbox protocol and safety
        run: deno test --allow-net=127.0.0.1 --allow-read --allow-env --allow-sys=hostname --config supabase/functions/admin-support-mailbox/deno.json supabase/functions/admin-support-mailbox/mailbox.test.ts
      - name: Test central support permissions and synchronization
        run: node scripts/test-support-db.mjs
      - name: Test mailbox watermark and permissions
        run: node scripts/test-support-mailbox-db.mjs
      - name: Test source support relay acknowledgements and retries
        run: node scripts/test-support-relay.mjs
      - name: Test portfolio management version conflicts
        run: node scripts/test-portfolio-management-db.mjs
      - run: npm run test:guardian-db
      - run: npm run build
