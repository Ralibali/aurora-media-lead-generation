name: Aurora Watch
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: aurora-watch-production
  cancel-in-progress: false
jobs:
  browser-flows:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.AURORA_WATCH_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run due customer journeys
        run: node scripts/aurora-watch-runner.mjs
